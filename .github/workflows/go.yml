name: Go CI/CD

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ] # Triggers on version tags
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26' # Updated to 1.26+ for better toolchain support
          cache: true       # Automatically caches dependencies

      - name: Build
        run: go build -v -o imap-shadow ./cmd/imap-shadow

      - name: Test
        run: go test -v ./...

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to upload assets to a release
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build Linux AMD64
        env:
          GOOS: linux
          GOARCH: amd64
        run: go build -v -o imap-shadow-linux-amd64 ./cmd/imap-shadow

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: imap-shadow-linux-amd64
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
