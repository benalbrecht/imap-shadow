# imap-shadow example configuration.
# Copy to /etc/imap-shadow/config.toml and adjust.

[listen]
# Public IMAPS endpoint. Clients connect here.
addr = "0.0.0.0:993"

[acme]
# HTTP-01 challenge server runs on :80 (Stalwart doesn't bind it).
# This hostname must resolve to this host and :80 must be reachable
# from the public internet during cert issuance and renewal.
hostnames = ["mail.example.com"]
email     = "admin@example.com"
cache_dir = "/var/lib/imap-shadow/acme"
http_addr = "0.0.0.0:80"
# Optional: override the ACME directory (default: Let's Encrypt prod).
# directory = "https://acme-staging-v02.api.letsencrypt.org/directory"

[upstream]
# Default: plaintext IMAP on loopback to avoid double-TLS.
addr = "127.0.0.1:143"
tls  = false
# Enable only if upstream expects PROXY protocol v2.
proxy_protocol = false
# If Stalwart is configured TLS-only, use:
# addr            = "127.0.0.1:9993"
# tls             = true
# sni             = "mail.example.com"
# tls_skip_verify = false

[capability]
# Capability tokens stripped from server responses before forwarding.
# COMPRESS=DEFLATE: would force the proxy to inflate/deflate every frame.
# REFERRAL: a client redirected to the backend host would bypass the proxy.
# *_PLUS: channel-binding mechanisms break when TLS is terminated here.
strip = [
  "COMPRESS=DEFLATE",
  "REFERRAL",
  "AUTH=GSSAPI",
  "AUTH=SCRAM-SHA-256-PLUS",
  "AUTH=SCRAM-SHA-1-PLUS",
]

[namespace]
# Path prefixes that mark the shared-folder namespace. These prefixes are
# exempt from "hide_personal" — they remain visible.
shared_prefixes = ["Shared Folders/", "Other Users/"]

[policy]
# Reject MOVE / UID MOVE between different accounts (e.g. between two
# shared accounts, or between a personal mailbox and a shared one).
# COPY is always permitted. Aim: prevent accidental drag-and-drop moves
# in webmail UIs that some IMAP servers (Stalwart) allow at the protocol
# level even though the user lacks delete rights on the source.
block_cross_account_moves = false

# --- Rules -------------------------------------------------------------
# Each [[rules]] block applies to either an exact "user" or "*" (everyone).
# Multiple matching rules stack: hide lists are unioned.
# hide_personal defaults from "*" rules; exact-user hide_personal values
# override that default (both wildcard and exact values are OR-ed within
# their own group). INBOX is hardcoded to never be hidden.

# Hide some folders from everyone. Listing "Trash" also hides
# "Trash/Old", "Trash/Old/2023", etc.
[[rules]]
user = "*"
hide = ["Trash", "Archive/Legacy"]
hide_personal = true

# Whitelist: this user keeps personal folders visible despite global
# hide_personal=true above.
[[rules]]
user          = "newsletter-bot@example.com"
hide_personal = false
